<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F0B1E" />
    <meta name="description" content="Learn SD — a calm, bite-sized study path for SAIT Software Development students." />
    <script>
      try {
        var theme = localStorage.getItem('learn-sd-theme');
        document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
        if (theme === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f6f2fb');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
    <style>
      html, body { background: #0f0b1e; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f6f2fb; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Learn SD</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
